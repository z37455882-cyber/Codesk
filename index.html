<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Codesk</title>
<meta name="referrer" content="no-referrer">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#09090b;--tx:#ececf0;--mu:#7b7b86;--ln:rgba(255,255,255,.08);--ac:#9a7bff;--ac2:#c58bff;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Onest',system-ui,sans-serif;font-size:16px;line-height:1.6;overflow:hidden}
body::before{content:"";position:fixed;left:50%;top:-30vh;width:70vmax;height:50vmax;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(154,123,255,.13),transparent);pointer-events:none}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:flex-end;padding:calc(var(--sat) + 14px) 20px 10px;position:relative;z-index:3}
.logo{font-family:'Unbounded',sans-serif;font-weight:600;font-size:17px;letter-spacing:.04em;background:linear-gradient(90deg,var(--tx),var(--mu));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.03);color:var(--mu);display:grid;place-items:center;cursor:pointer;transition:.2s}
.ib:hover{color:var(--tx);background:rgba(255,255,255,.08)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feed{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#222 transparent}
.col{max-width:720px;margin:0 auto;padding:10px 20px 150px;display:flex;flex-direction:column;gap:28px}
.hero{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.hero h1{font-family:'Unbounded',sans-serif;font-weight:500;font-size:clamp(34px,8vw,56px);letter-spacing:.06em;background:linear-gradient(120deg,#fff 20%,var(--ac) 60%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--ln);background:rgba(255,255,255,.03);color:var(--tx);font:inherit;font-size:14px;padding:8px 15px;border-radius:20px;cursor:pointer;transition:.2s}
.chip:hover{border-color:rgba(154,123,255,.5);background:rgba(154,123,255,.08)}
.u{align-self:flex-end;max-width:85%;background:rgba(255,255,255,.07);border:1px solid var(--ln);padding:10px 16px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;word-wrap:break-word;animation:in .35s ease both}
.a{display:flex;gap:14px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.mk{width:26px;height:26px;border-radius:50%;flex:none;margin-top:3px;background:conic-gradient(from 200deg,var(--ac),var(--ac2),var(--ac));box-shadow:0 0 18px rgba(154,123,255,.45)}
.a.busy .mk{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ab{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.ab p{animation:line .4s ease both}
@keyframes line{from{opacity:0;filter:blur(4px)}}
.caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-3px;background:var(--ac);border-radius:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* размышление */
.think{border:1px solid var(--ln);border-radius:16px;background:rgba(255,255,255,.025);overflow:hidden}
.th{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.th .tl{flex:1}
.think.run .tl{background:linear-gradient(90deg,var(--mu) 30%,#fff 50%,var(--mu) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.8s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.th svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.think.open .th svg{transform:rotate(180deg)}
.sw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,.9,.3,1)}
.think.open .sw{grid-template-rows:1fr}
.steps{overflow:hidden;padding:0 16px}
.think.open .steps{padding:2px 16px 14px;max-height:300px;overflow:auto;scrollbar-width:thin}
.st{position:relative;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mu);padding:0 0 18px;transition:color .3s}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:1px;background:var(--ln)}
.st:last-child::before{display:none}
.st .ic{width:21px;height:21px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--ln);background:var(--bg);position:relative;z-index:1}
.st svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.st .pa,.st .ck,.st .sp{display:none}
.st.pend .pa{display:block;fill:currentColor;stroke:none;opacity:.7}
.st.act{color:var(--tx)}
.st.act .ic{border-color:transparent}
.st.act .sp{display:block;width:21px;height:21px;position:absolute;inset:-1px;border-radius:50%;border:2px solid transparent;border-top-color:var(--ac);border-right-color:var(--ac);animation:spin .8s linear infinite}
.st.done{color:var(--tx)}
.st.done .ic{background:var(--ac);border-color:var(--ac);color:#06101f}
.st.done .ck{display:block;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0)}}

/* файл */
.file{border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:#0d0d11;animation:in .4s ease both}
.fh{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--ln);font-size:14px}
.fh b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh em{font-style:normal;color:var(--mu);font-size:12px}
.fh button{border:1px solid var(--ln);background:none;color:var(--mu);font:inherit;font-size:13px;padding:4px 12px;border-radius:12px;cursor:pointer;transition:.2s}
.fh button:hover{color:var(--tx);background:rgba(255,255,255,.07)}
pre{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:1.7;padding:14px 16px;overflow-x:auto;color:#c9cbd6;tab-size:4}
pre div{white-space:pre;min-height:1.7em;animation:line .3s ease both}
.k{color:#c58bff}.s{color:#8fe3b0}.c{color:#6b6e7c;font-style:italic}.f{color:#9a7bff}

/* ввод */
.dock{position:absolute;left:0;right:0;bottom:0;padding:40px 16px calc(var(--sab) + 16px);background:linear-gradient(transparent,var(--bg) 55%);z-index:4;pointer-events:none}
.box{pointer-events:auto;max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 20px;border-radius:28px;background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 40px rgba(0,0,0,.6);transition:border-color .25s,box-shadow .25s}
.box:focus-within{border-color:rgba(154,123,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 4px rgba(154,123,255,.1),0 12px 40px rgba(0,0,0,.6)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--tx);font:inherit;font-size:16px;line-height:1.5;max-height:160px;padding:9px 0}
textarea::placeholder{color:var(--mu)}
.go{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--ac),var(--ac2));color:#0a0f20;transition:transform .25s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.go:hover{transform:scale(1.08)}.go:active{transform:scale(.9)}
.go:disabled{opacity:.3;cursor:default;transform:none}
.go svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.go .sq{display:none;fill:currentColor;stroke:none;width:15px;height:15px}
.go.stop .ar{display:none}.go.stop .sq{display:block}
.pvk{cursor:pointer;transition:border-color .25s,transform .25s}.pvk:hover{border-color:rgba(154,123,255,.55);transform:translateY(-1px)}
.fh .pvb{color:var(--tx);border-color:rgba(154,123,255,.5);background:rgba(154,123,255,.1)}
.pv{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#0c0c10;border-left:1px solid var(--ln);z-index:50;transform:translateX(104%);transition:transform .5s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.6)}
.pv.on{transform:none}
.pvh{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 12px) 14px 12px 18px;border-bottom:1px solid var(--ln)}
.pvh b{flex:1;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvh em{font-style:normal;font-size:12px;color:var(--mu);border:1px solid var(--ln);border-radius:10px;padding:2px 9px}
.pvbody{flex:1;position:relative;background:#000}
.pvbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;transition:opacity .5s}
.ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mu);font-size:14px;z-index:2;background:#0c0c10}
.ld i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--ac);border-right-color:var(--ac2);animation:spin .8s linear infinite}
.dl{border:1px solid rgba(154,123,255,.35);background:rgba(154,123,255,.06);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;animation:in .35s ease both}
.dt b{display:block;font-weight:500}.dt span{font-size:13px;color:var(--mu)}
.db{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.db button{font:inherit;font-size:14px;padding:8px 18px;border-radius:18px;cursor:pointer;border:1px solid var(--ln);background:none;color:var(--tx);transition:.2s}
.db .no:hover{background:rgba(255,255,255,.07)}
.db .yes{border:0;background:linear-gradient(140deg,var(--ac),var(--ac2));color:#0a0f20;font-weight:500}
.pg{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.pg>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .1s}
.db em{font-style:normal;font-size:12px;color:var(--mu);min-width:74px;text-align:right}
.st0{font-style:normal;font-size:13px;color:var(--mu)}.st0.ok{color:#8fe3b0}
.st{transition:opacity .45s,filter .45s,color .3s;animation:in .4s ease both}
.think.run.open .steps{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 50%);mask-image:linear-gradient(transparent,#000 50%)}
.fx{display:inline-block;animation:fxin .45s ease both}
@keyframes fxin{from{opacity:0;transform:translateY(6px);filter:blur(3px)}}
.wait{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:14px;animation:in .5s ease both}
.wait canvas{width:60px;height:60px;flex:none}
.fw{position:relative;max-width:420px;animation:in .4s ease both}
.fc{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;border:1px solid var(--ln);background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.02));color:inherit;font:inherit;text-align:left;cursor:default;transition:border-color .25s,background .25s}
.fw.ready .fc{cursor:pointer}.fw.ready .fc:hover,.fw.o .fc{border-color:rgba(154,123,255,.55);background:rgba(154,123,255,.07)}
.fi{width:46px;height:54px;border-radius:10px 16px 10px 10px;flex:none;display:grid;place-items:end center;padding-bottom:7px;font-size:11px;font-weight:600;letter-spacing:.04em;color:#0a0f20;background:linear-gradient(160deg,#9db4ff,#c58bff);position:relative}
.fi::before{content:'';position:absolute;top:0;right:0;width:15px;height:15px;background:linear-gradient(225deg,var(--bg) 50%,rgba(255,255,255,.55) 50%);border-bottom-left-radius:5px}
.e-PY{background:linear-gradient(160deg,#ffd76b,#6bb0ff)}.e-JSON{background:linear-gradient(160deg,#9af0c0,#6bb0ff)}.e-HTML{background:linear-gradient(160deg,#ffb07a,#ff7ab0)}
.fm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.fm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{font-style:normal;font-size:13px;color:var(--mu)}
.fp{height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}.fp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.fw.ready .fp{display:none}
.cv{width:18px;height:18px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s;opacity:0}
.fw.ready .cv{opacity:1}.fw.o .cv{transform:rotate(180deg)}
.fmenu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:10;display:none;flex-direction:column;padding:6px;border-radius:20px;background:rgba(24,24,32,.86);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 20px 50px rgba(0,0,0,.6)}
.fw.o .fmenu{display:flex;animation:in .25s ease both}
.fmenu button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left}
.fmenu button:hover{background:rgba(255,255,255,.08)}.fmenu .mi{width:24px;text-align:center;color:var(--ac)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);padding:10px 18px;border-radius:20px;background:rgba(40,40,52,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);font-size:14px;z-index:90;animation:in .3s ease both}
.pvt{display:flex;gap:2px;padding:3px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--ln)}
.pvt button{border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:5px 11px;border-radius:11px;cursor:pointer}
.pvt button.on{background:rgba(154,123,255,.2);color:var(--tx)}
.pvcode,.pvcon{flex:1;margin:0;overflow:auto;background:#0b0b0f;display:none}
.pv[data-t=code] .pvcode,.pv[data-t=con] .pvcon{display:block}
.pv:not([data-t=view]) .pvbody{display:none}
.think.run .tl{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--mu);animation:none}
.think.run .shm{background:linear-gradient(90deg,var(--mu) 30%,#fff 50%,var(--mu) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.8s linear infinite}
.think.run.open .steps{max-height:300px;overflow:auto;-webkit-mask-image:none;mask-image:none}
.th .tl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet.on{opacity:1;pointer-events:auto}
.sh{width:min(440px,100% - 24px);margin:0 12px calc(var(--sab) + 14px);padding:8px;border-radius:30px;background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(30,30,40,.88) 50%);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px rgba(0,0,0,.7);transform:translateY(50px) scale(.96);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.sheet.on .sh{transform:none}
.shh{display:flex;align-items:center;gap:14px;padding:10px 12px 12px}
.shl{display:flex;flex-direction:column}
.shl button,.shx{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:16px;padding:13px 14px;border-radius:16px;cursor:pointer;text-align:left;transition:background .2s}
.shl button:hover,.shx:hover{background:rgba(255,255,255,.09)}
.shl .mi{width:26px;text-align:center;color:var(--ac)}
.shx{justify-content:center;margin-top:6px;background:rgba(255,255,255,.07);font-weight:500}
.wl{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(9,9,11,.35);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);transition:opacity .9s ease,backdrop-filter .9s ease,-webkit-backdrop-filter .9s ease}
.wl.out{opacity:0;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);pointer-events:none}
.wc{width:min(400px,100%);padding:34px 26px 24px;border-radius:34px;text-align:center;background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%,rgba(255,255,255,.08));-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 30px 80px rgba(0,0,0,.65);animation:wlin .9s cubic-bezier(.2,1,.3,1) both;transition:transform .7s,opacity .7s}
.wl.out .wc{transform:scale(.94) translateY(12px);opacity:0}
@keyframes wlin{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(8px)}}
.wm{width:68px;height:68px;border-radius:50%;margin:0 auto 20px;background:conic-gradient(from 200deg,var(--ac),var(--ac2),var(--ac));box-shadow:0 0 40px rgba(154,123,255,.55),inset 0 3px 6px rgba(255,255,255,.4);animation:spin 6s linear infinite}
.wc h2{font-weight:500;font-size:25px;line-height:1.25;margin-bottom:8px}
.wc p{color:var(--mu);font-size:15px}
.wf{position:relative;margin-top:22px}
.wf input{width:100%;height:54px;border-radius:27px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.28);color:var(--tx);font:inherit;font-size:15px;padding:0 52px 0 20px;outline:0;box-shadow:inset 0 2px 6px rgba(0,0,0,.25);transition:border-color .25s,box-shadow .25s}
.wf input:focus{border-color:rgba(154,123,255,.6);box-shadow:0 0 0 4px rgba(154,123,255,.12)}
.wf input::placeholder{color:var(--mu)}
.wy{position:absolute;right:8px;top:7px;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--mu);cursor:pointer;display:grid;place-items:center}
.wy:hover{color:var(--tx);background:rgba(255,255,255,.07)}
.wy svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.we{min-height:22px;margin-top:10px;font-size:13px;color:#ff8aa0}
.wb{width:100%;height:54px;border:0;border-radius:27px;cursor:pointer;font:inherit;font-weight:500;font-size:16px;color:#0a0f20;background:linear-gradient(140deg,var(--ac),var(--ac2));box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 10px 30px rgba(154,123,255,.35);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.wb:hover{transform:scale(1.02)}.wb:active{transform:scale(.97)}
.wt{margin-top:14px;border:0;background:none;color:var(--ac);font:inherit;font-size:14px;cursor:pointer;padding:6px 10px;border-radius:12px}
.wt:hover{background:rgba(154,123,255,.1)}
.wn{margin-top:16px;font-size:12px;color:var(--mu)}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.wld{display:none;flex-direction:column;align-items:center;gap:16px;margin-top:6px}
.wc.busy .wform{display:none}.wc.busy .wld{display:flex}
.wc.busy h2,.wc.busy>p{display:none}
.wst{font-size:16px;min-height:24px}
.wbar{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.wbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s ease}

    var l=document.createElement('li');if(x.d)l.className='d';

  var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];

}

setInterval(function(){step();draw()},120);

</html>`};

/* ======== подключение к боту через ntfy.sh (вместо демо-ответов) ======== */
var TGW=window.Telegram&&window.Telegram.WebApp;
try{if(TGW){TGW.ready();TGW.expand();if(TGW.setHeaderColor)TGW.setHeaderColor('#09090b');if(TGW.setBackgroundColor)TGW.setBackgroundColor('#09090b');if(TGW.disableVerticalSwipes)TGW.disableVerticalSwipes()}}catch(e){}
var INIT=(TGW&&TGW.initData)||'';
if(!INIT){try{INIT=new URLSearchParams(location.hash.slice(1)).get('tgWebAppData')||''}catch(e){}}

var rlQS=new URLSearchParams(location.search),rlK='';
try{
  rlK=(rlQS.get('k')||'').replace(/[^0-9a-fA-F]/g,'');
  if(rlK)localStorage.setItem('cdk_k',rlK);else rlK=localStorage.getItem('cdk_k')||'';
}catch(e){}
var rlNtfy=/^(https:\/\/|http:\/\/(127\.0\.0\.1|localhost)[:\/])/.test(rlQS.get('n')||'')?rlQS.get('n').replace(/\/+$/,''):'https://ntfy.sh';
try{if(rlQS.has('k')||rlQS.has('n'))history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
var rlZ=typeof CompressionStream==='function'&&typeof DecompressionStream==='function';
var rlPend={},rlBuf={},rlSeen={},rlSince='',rlES=null,rlOpenRes,rlReady=new Promise(function(r){rlOpenRes=r});
function rlB64e(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function rlB64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function rlPipe(u,S){var st=new S('deflate'),w=st.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(st.readable).arrayBuffer())}
async function rlChunk(m){
  var p=String(m).split('.');if(p.length<5)return;
  var id=p[0],base=id.split('_')[0],i=+p[1],n=+p[2],f=p[3];
  if(!rlPend[base]||!(n>0))return;
  var b=rlBuf[id]||(rlBuf[id]={n:n,parts:{},c:0});
  if(b.parts[i]===undefined){b.parts[i]=p.slice(4).join('.');b.c++}
  if(b.c<b.n)return;
  delete rlBuf[id];
  try{
    var s='';for(var k=0;k<n;k++)s+=b.parts[k];
    var u=rlB64d(s);if(f==='z')u=await rlPipe(u,DecompressionStream);
    var obj=JSON.parse(new TextDecoder().decode(u)),pd=rlPend[base];
    if(!pd)return;
    if(obj&&obj.p===1){if(pd.onp)pd.onp(obj);return}
    delete rlPend[base];pd.res(obj);
  }catch(e){var pe=rlPend[base];if(pe){delete rlPend[base];pe.rej(new Error('Не удалось разобрать ответ бота'))}}
}
function rlConnect(){
  if(rlES){try{rlES.close()}catch(e){}}
  var es=rlES=new EventSource(rlNtfy+'/cdko-'+rlK+'/sse'+(rlSince?'?since='+rlSince:''));
  es.onmessage=function(e){
    var d;try{d=JSON.parse(e.data)}catch(x){return}
    if(d.event==='open'){if(!rlSince&&d.time)rlSince=String(d.time);rlOpenRes();return}
    if(d.event!=='message'||rlSeen[d.id])return;
    rlSeen[d.id]=1;
    if(d.time)rlSince=String(d.time-1);
    rlChunk(d.message);
  };
  es.onerror=function(){if(rlES!==es)return;try{es.close()}catch(x){}setTimeout(rlConnect,2000)};
}
if(rlK)rlConnect();
async function rlCall(path,body,job,onp,onsent){
  if(!rlK)throw new Error('Откройте приложение через бота: отправьте ему /App');
  await Promise.race([rlReady,new Promise(function(r){setTimeout(r,8000)})]);
  var id=Math.random().toString(36).slice(2,12),t0=Date.now(),iv;
  var prom=new Promise(function(res,rej){
    rlPend[id]={res:function(v){clearInterval(iv);res(v)},rej:function(e){clearInterval(iv);rej(e)},onp:onp};
    iv=setInterval(function(){
      if(job&&job.stopped){clearInterval(iv);delete rlPend[id];rej(new Error('__stop'))}
      else if(Date.now()-t0>1800000){clearInterval(iv);delete rlPend[id];rej(new Error('Превышено время ожидания ответа'))}
    },400);
  });
  prom.catch(function(){});
  try{
    var u=new TextEncoder().encode(JSON.stringify({p:path,b:body,z:rlZ?1:0})),f='p';
    if(rlZ){u=await rlPipe(u,CompressionStream);f='z'}
    var s=rlB64e(u),n=Math.max(1,Math.ceil(s.length/3000));
    for(var i=0;i<n;i++){
      var r=await fetch(rlNtfy+'/cdki-'+rlK,{method:'POST',body:id+'.'+i+'.'+n+'.'+f+'.'+s.slice(i*3000,(i+1)*3000)});
      if(!r.ok)throw new Error(r.status===429?'Лимит сообщений ntfy.sh исчерпан, попробуйте позже':'ntfy.sh: ошибка HTTP '+r.status);
    }
    if(onsent&&rlPend[id])onsent();
  }catch(e){
    var pd=rlPend[id];
    if(pd){delete rlPend[id];pd.rej(e instanceof TypeError?new Error('Нет связи с ntfy.sh — проверьте интернет'):e)}
  }
  return prom;
}

/* ======== интерфейс: реальные ответы вместо заготовок ======== */
var SESS=Math.random().toString(36).slice(2,8),FN=0;
var HL_KW={
  Python:'import|from|def|class|return|if|elif|else|for|while|in|not|and|or|try|except|finally|with|as|pass|break|continue|lambda|None|True|False|raise|yield|async|await',
  JavaScript:'const|let|var|function|return|if|else|for|while|class|new|import|export|from|async|await|try|catch|throw|true|false|null|undefined|this|switch|case|break|continue',
  Shell:'if|then|else|fi|for|do|done|echo|cd|export'
};
function hl(line,lang){
  var re,cls,m,out='',last=0;
  if(lang==='HTML'){re=/(<\/?[A-Za-z!][\w-]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g;cls=['k','s']}
  else{
    var kw=HL_KW[lang],cm=(lang==='Python'||lang==='Shell')?'#.*$':'\\/\\/.*$';
    re=new RegExp('('+cm+')|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')|\\b('+(kw||'(?!)')+')\\b','g');cls=['c','s','k'];
  }
  while((m=re.exec(line))){
    if(m[0]==='')break;
    var gi=1;while(gi<m.length&&m[gi]===undefined)gi++;
    out+=esc(line.slice(last,m.index))+'<span class="'+cls[gi-1]+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(line.slice(last));
}
function makeTitle(t){var s=String(t||'').replace(/\s+/g,' ').trim();s=s.charAt(0).toUpperCase()+s.slice(1);return s.length>26?s.slice(0,24).trim()+'…':s}
function aiText(root){return Array.prototype.map.call(root.querySelectorAll('.ab>p,.ab>pre'),function(p){return p.textContent}).join('\n')}

/* живое «размышление»: только настоящие шаги работы бота */
function liveThink(ai){
  var t=document.createElement('div');t.className='think run';
  t.innerHTML="<button class='th' type='button'><span class='tl'></span><svg viewBox='0 0 24 24'><path d='M6 9l6 6 6-6'/></svg></button><div class='sw'><div class='steps'></div></div>";
  t.querySelector('.th').onclick=function(){t.classList.toggle('open')};
  ai.body.appendChild(t);
  var tl=t.querySelector('.tl'),box=t.querySelector('.steps'),w=waitHint(),n=0,cur=null,follow=true;

  lab('Размышляю…');

    },

}

/* ответ: абзацы печатаются по словам, ``` — блоки кода, **жирный** и `код` внутри строки */
function inl(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
async function stream(ai,text){
  var segs=String(text||'').split(/```/),total=0;
  segs.forEach(function(sg,i){if(i%2===0)total+=sg.split(/\s+/).length});
  var d=Math.max(3,Math.min(30,2200/Math.max(1,total)));
  for(var si=0;si<segs.length&&!stopped;si++){
    if(si%2===1){
      var code=segs[si].replace(/^[^\n]*\n/,'').replace(/\n$/,'');
      var pre=document.createElement('pre');pre.className='cblk';pre.textContent=code;ai.body.appendChild(pre);down();await sleep(80);continue;
    }
    var lines=segs[si].split('\n');
    for(var i=0;i<lines.length&&!stopped;i++){
      if(!lines[i].trim())continue;
      var p=document.createElement('p'),c=document.createElement('span');c.className='caret';p.appendChild(c);ai.body.appendChild(p);
      var plain=lines[i].replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1'),w=plain.split(' ');
      for(var j=0;j<w.length&&!stopped;j++){c.insertAdjacentText('beforebegin',(j?' ':'')+w[j]);down();await sleep(d)}
      c.remove();
      if(/`|\*\*/.test(lines[i]))p.innerHTML=inl(lines[i]);
      await sleep(60);
    }
  }
}

async function fileCard(ai,k){

function openSheet(k){

/* отправка запроса боту */
async function reply(t,extra){
  var ai=addAI(),lt=liveThink(ai),job={get stopped(){return stopped}},seen=0,r=null;
  lt.step('Отправляю запрос боту');
  try{
    r=await rlCall('/api/ask',{init:INIT,text:extra?t+extra:t,mind:REASON,model:MODEL,chat:SESS+'-'+CHATS[curChat].id},job,
      function(o){var s=o.s||[];s.slice(seen).forEach(function(x){lt.step(x)});seen=s.length},
      function(){lt.step('Модель готовит ответ')});
    if(r.error)throw new Error(r.error);
    (r.s||[]).slice(seen).forEach(function(x){lt.step(x)});
    lt.end(true);
    await stream(ai,r.answer||'');
    var fl=r.files||[];
    for(var i=0;i<fl.length&&!stopped;i++){var key='f'+(++FN);CODE[key]=fl[i];await fileCard(ai,key)}
  }catch(e){
    if(e.message==='__stop'){lt.end(true);toast('Остановлено')}
    else{lt.end(false);var p=document.createElement('p');p.className='err';p.textContent='❌ '+e.message;ai.body.appendChild(p)}
  }
  ai.root.classList.remove('busy');
}

async function replyAtt(att,t){
  var extra='',skipped=[],tot=0,TXT=/\.(txt|md|py|js|ts|html?|css|json|csv|xml|ya?ml|sh|c|cpp|h|java|kt|go|rs|sql|ini|log)$/i;
  for(var i=0;i<att.length;i++){
    var a=att[i],f=a.file;
    if(f&&!a.img&&f.size<=24000&&tot+f.size<=40000&&(/^text\//.test(f.type)||TXT.test(f.name))){
      try{extra+='\n\n[Файл «'+a.name+'»]\n'+await f.text();tot+=f.size;continue}catch(e){}
    }
    skipped.push(a.name);
  }
  if(!extra){
    var ai=addAI();
    await stream(ai,'Пока я читаю только текстовые файлы до 24 КБ. Изображения и другие файлы в приложение не передаются: '+skipped.join(', ')+'.');
    ai.root.classList.remove('busy');return;
  }
  if(skipped.length)toast('Не переданы: '+skipped.join(', '));
  await reply(t||'Посмотри прикреплённый файл.',extra);
}
